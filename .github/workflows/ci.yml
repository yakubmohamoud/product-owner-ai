name: CI

on:
  pull_request:
    branches:
      - main
      - qa
      - pre-production
  push:
    branches:
      - main
      - qa
      - pre-production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run smoke

      - name: Run tests
        run: npm test

      - name: Build production container
        run: docker build --tag product-owner-ai:${{ github.sha }} .
