services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MANAGED_MAX_OUTPUT_TOKENS: ${MANAGED_MAX_OUTPUT_TOKENS:-4096}
      LLM_INPUT_COST_MICRO_USD_PER_MILLION: ${LLM_INPUT_COST_MICRO_USD_PER_MILLION:-150000}
      LLM_OUTPUT_COST_MICRO_USD_PER_MILLION: ${LLM_OUTPUT_COST_MICRO_USD_PER_MILLION:-600000}
      LLM_MODEL_PRICING_JSON: ${LLM_MODEL_PRICING_JSON:-}
      MANAGED_LLM_MARKUP_BPS: ${MANAGED_LLM_MARKUP_BPS:-3000}
      MANAGED_CREDIT_PACK_MICRO_USD: ${MANAGED_CREDIT_PACK_MICRO_USD:-25000000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      LLM_RATE_LIMIT_MAX: ${LLM_RATE_LIMIT_MAX:-30}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-10mb}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:-}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      EXTENSION_ORIGIN: ${EXTENSION_ORIGIN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BYOK: ${STRIPE_PRICE_BYOK:-}
      STRIPE_PRICE_MANAGED_CREDITS: ${STRIPE_PRICE_MANAGED_CREDITS:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_PAYG: ${STRIPE_PRICE_PAYG:-}
      STRIPE_METER_EVENT_NAME: ${STRIPE_METER_EVENT_NAME:-}
      DATA_DIRECTORY: /app/.data
    volumes:
      - product_owner_data:/app/.data

volumes:
  product_owner_data:
